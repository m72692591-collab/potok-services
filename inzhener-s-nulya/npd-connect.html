<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение «Мой налог»</title><style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f8fa;color:#111820;margin:0}.w{max-width:680px;margin:7vh auto;padding:18px}.card{background:#fff;border:1px solid #dbe2e9;border-radius:20px;padding:22px}.muted{color:#64707c;line-height:1.5}.ok{color:#087a55;font-weight:800}.err{color:#a21d1d;font-weight:700}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;background:#ffb000;cursor:pointer;width:100%;margin-top:10px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd7df;border-radius:12px;font:inherit;margin:8px 0}.step{padding:14px 0;border-top:1px solid #edf0f3}.step:first-of-type{border-top:0}</style></head><body><main class="w"><h1>Подключение «Мой налог»</h1><div class="card"><p class="muted">Одноразовая привязка по SMS. Пароль от ФНС не нужен. После подтверждения магазин будет автоматически формировать чек НПД после статуса CONFIRMED от Т‑Бизнеса.</p><div id="status" class="muted">Проверяем состояние…</div><div id="connect" hidden>
<div class="step"><b>1. Номер телефона «Моего налога»</b><input id="phone" inputmode="tel" placeholder="+7 999 123-45-67"><button class="btn" id="sms">Получить SMS-код</button></div>
<div class="step"><b>2. Код из SMS</b><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Код"><button class="btn" id="verify">Подключить</button></div>
</div><p id="msg"></p></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'';
const status=document.getElementById('status'),connect=document.getElementById('connect'),msg=document.getElementById('msg');
async function check(){
 if(!token){status.innerHTML='<span class="err">Нет ключа доступа.</span>';return}
 try{
  const r=await fetch('/api/npd?token='+encodeURIComponent(token)+'&action=status,{cache:'no-store'});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Ошибка доступа');
  if(d.connected){status.innerHTML='<span class="ok">«Мой налог» подключён.</span><br>ИНН: '+d.inn+'<br>Автоматические чеки можно включать.';connect.hidden=true}
  else{status.textContent='Связь ещё не настроена.';connect.hidden=false}
 }catch(e){status.innerHTML='<span class="err">'+e.message+'</span>'}
}
document.getElementById('sms').onclick=async()=>{
 const b=document.getElementById('sms');b.disabled=true;msg.textContent='Отправляем SMS…';
 try{
  const r=await fetch('/api/npd',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action:'start',phone:document.getElementById('phone').value})});
  const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'Не удалось отправить SMS');
  msg.className='ok';msg.textContent='SMS отправлено. Введи код ниже.';
 }catch(e){msg.className='err';msg.textContent=e.message}finally{b.disabled=false}
};
document.getElementById('verify').onclick=async()=>{
 const b=document.getElementById('verify');b.disabled=true;msg.textContent='Подключаем…';
 try{
  const r=await fetch('/api/npd',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action:'verify',code:document.getElementById('code').value})});
  const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'Не удалось подключить');
  msg.className='ok';msg.textContent='Подключено.';await check();
 }catch(e){msg.className='err';msg.textContent=e.message}finally{b.disabled=false}
};
check();
</script></body></html>
