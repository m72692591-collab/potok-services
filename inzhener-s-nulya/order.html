<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказ — Инженер с нуля</title><style>body{font-family:system-ui;background:#f5f7f9;color:#111;margin:0}.w{max-width:720px;margin:8vh auto;padding:20px}.b{background:#fff;border:1px solid #dce2e8;border-radius:20px;padding:24px}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:800;background:#ffb000;cursor:pointer}</style></head><body><main class="w"><a href="/">← На главную</a><h1>Ваш заказ</h1><div class="b" id="s">Проверяем оплату…</div></main><script>const q=new URLSearchParams(location.search),orderId=q.get('orderId'),product=q.get('product'),token=q.get('token'),box=document.getElementById('s');async function check(){try{const r=await fetch('/api/order-status?'+new URLSearchParams({orderId:orderId||'',product:product||'',token:token||''})),d=await r.json();if(d.state==='paid'){box.innerHTML='<h2>Оплата подтверждена</h2><p>Курс готов к выдаче.</p><button class="btn" id="dl">Скачать курс</button>';document.getElementById('dl').onclick=download;return}if(d.state==='failed'||d.state==='mismatch'||d.state==='forbidden'){box.innerHTML='<h2>Не удалось подтвердить оплату</h2><p>Вернитесь на главную или свяжитесь с продавцом.</p>';return}box.textContent='Оплата обрабатывается. Проверяем снова…';setTimeout(check,5000)}catch(e){box.textContent='Временная ошибка. Повторяем…';setTimeout(check,7000)}}async function download(){const r=await fetch('/api/download?'+new URLSearchParams({orderId,product,token})),d=await r.json();if(d.url)location.href=d.url;else alert('Доступ пока не готов.')}check()</script></body></html>
