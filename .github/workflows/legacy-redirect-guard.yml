name: Legacy redirect V2 guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: legacy-redirect-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate_legacy_redirect_v2.py \
            scripts/tests/test_validate_legacy_redirect_v2.py

      - name: Run negative tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s scripts/tests \
            -p 'test_validate_legacy_redirect_v2.py' \
            -v

      - name: Validate redirect-only deployment contract
        run: |
          set -euo pipefail
          mkdir -p legacy-redirect-evidence
          python scripts/validate_legacy_redirect_v2.py \
            --root . \
            --report legacy-redirect-evidence/static-contract.json
          sha256sum \
            public/index.html \
            public/404.html \
            public/robots.txt \
            legacy_status.json \
            > legacy-redirect-evidence/SHA256SUMS.txt

      - name: Upload static contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-redirect-static-${{ github.run_id }}
          path: legacy-redirect-evidence
          if-no-files-found: error
          retention-days: 90
