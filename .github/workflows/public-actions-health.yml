name: Public Actions health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-actions-health.yml'
      - 'automation/health/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create health evidence
        run: |
          mkdir -p automation/health
          printf '{\n  "status": "PUBLIC_ACTIONS_RUNNER_READY",\n  "checked_at_utc": "%s",\n  "repository": "%s",\n  "run_id": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > automation/health/PUBLIC_ACTIONS_RUNNER_READY.json
      - name: Commit health evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/health/PUBLIC_ACTIONS_RUNNER_READY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish public Actions runner health'
          git push
