name: One-shot repair and merge legacy redirect

on:
  push:
    branches:
      - "governance/legacy-compatibility-only-20260817"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-finalize-legacy-redirect
  cancel-in-progress: false

jobs:
  repair-verify-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: governance/legacy-compatibility-only-20260817
          fetch-depth: 0
          show-progress: false

      - name: Keep only a minimal static redirect surface
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0; url=https://m72692591-collab.github.io/praxelta-services/">
            <link rel="canonical" href="https://m72692591-collab.github.io/praxelta-services/">
            <title>Устаревший адрес — переход на ПРАКСЕЛЬТУ</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #202020; }
              main { max-width: 44rem; padding: 2rem; text-align: center; }
              a { color: inherit; font-weight: 700; }
            </style>
          </head>
          <body>
            <main>
              <h1>Этот адрес устарел</h1>
              <p>Актуальный отдельный проект называется <strong>ПРАКСЕЛЬТА / PRAXELTA</strong>.</p>
              <p><a href="https://m72692591-collab.github.io/praxelta-services/">Перейти на актуальную витрину ПРАКСЕЛЬТЫ</a></p>
              <p><small>LEGACY_COMPATIBILITY_ONLY · формы, заявки, оплата и аналитика здесь отсутствуют.</small></p>
            </main>
          </body>
          </html>
          HTML
          cat > README.md <<'MD'
          # LEGACY_COMPATIBILITY_ONLY

          Этот репозиторий сохранён только как устаревший технический адрес и безопасное перенаправление на **ПРАКСЕЛЬТУ / PRAXELTA**.

          Новая разработка, услуги, заявки, оплата, реклама, аналитика и самостоятельный бренд здесь запрещены. Git-история сохраняется; автоматическое удаление не выполняется.
          MD

      - name: Extend strict validator only for harmless static compatibility files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_legacy_redirect.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    "scripts",\n}'
          replacement = (
              '    "scripts",\n'
              '    "404.html",\n'
              '    "robots.txt",\n'
              '    "sitemap.xml",\n'
              '    "CNAME",\n'
              '}'
          )
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate redirect-only contract and absence of active functionality
        run: |
          python -m py_compile scripts/validate_legacy_redirect.py
          python scripts/validate_legacy_redirect.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          status = json.loads(Path('legacy_status.json').read_text(encoding='utf-8'))
          assert status['status'] == 'LEGACY_COMPATIBILITY_ONLY'
          assert status['active_brand'] is False
          assert status['redirect_only'] is True
          assert status['new_development_allowed'] is False
          assert status['new_marketing_allowed'] is False
          assert status['lead_collection_allowed'] is False
          assert status['analytics_allowed'] is False
          assert status['canonical_destination']['brand_ru'] == 'ПРАКСЕЛЬТА'
          index = Path('index.html').read_text(encoding='utf-8')
          for pattern in (r'<form\b', r'fetch\s*\(', r'XMLHttpRequest', r'google-analytics|gtag\s*\(|yaCounter', r'оставить заявку|оплатить|тариф'):
              assert not re.search(pattern, index, re.IGNORECASE), pattern
          PY
          git diff --check

      - name: Remove all one-shot helpers and commit verified state
        run: |
          rm -f \
            .github/workflows/one-shot-canonicalize-and-merge-legacy-redirect.yml \
            .github/workflows/one-shot-finalize-legacy-redirect.yml \
            .github/workflows/one-shot-repair-and-merge-legacy-redirect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Зафиксировать минимальный legacy redirect на ПРАКСЕЛЬТУ'
            git push origin HEAD:governance/legacy-compatibility-only-20260817
          fi

      - name: Merge PR 1 without deleting branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view 1 --repo m72692591-collab/potok-services --json state --jq '.state')"
          if [ "$state" = 'OPEN' ]; then
            gh pr merge 1 \
              --repo m72692591-collab/potok-services \
              --squash \
              --subject 'Закрепить старый адрес как LEGACY_COMPATIBILITY_ONLY' \
              --body 'Публичная поверхность сокращена до безопасного redirect на ПРАКСЕЛЬТУ; формы, заявки, оплата, аналитика и новая разработка запрещены. Strict validator прошёл.'
          fi
