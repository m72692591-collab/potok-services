name: Finalize compatibility-only status

on:
  push:
    branches:
      - "ops/compatibility-status-20260817"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-compatibility-status
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/compatibility-status-20260817
          fetch-depth: 0
          show-progress: false

      - name: Verify redirect-only repository
        run: |
          set -euo pipefail
          test -s ARCHIVED_COMPATIBILITY.md
          test -s index.html
          grep -Fq 'praxelta-services' index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8-sig')
          assert 'praxelta-services' in html
          forbidden = ['app', 'src', 'backend', 'server', 'api', 'database', 'migrations', 'package.json', 'requirements.txt', 'pyproject.toml']
          assert not [item for item in forbidden if Path(item).exists()]
          PY
          git diff --check

      - name: Remove finalizer and push exact final head
        id: final
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-compatibility-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить режим редиректа совместимости"
          git push origin HEAD:ops/compatibility-status-20260817
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge exact verified PR without deleting branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head ops/compatibility-status-20260817 --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then exit 0; fi
          actual="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$HEAD_SHA"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash \
            --subject "Закрепить старый репозиторий как редирект совместимости" \
            --body "Сохраняет старые ссылки, запрещает активную разработку и направляет пользователей к ПРАКСЕЛЬТЕ."
