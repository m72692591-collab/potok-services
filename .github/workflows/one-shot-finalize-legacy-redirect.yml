name: One-shot finalize legacy redirect

on:
  push:
    branches:
      - "governance/legacy-compatibility-only-20260817"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-finalize-legacy-redirect
  cancel-in-progress: false

jobs:
  finalize-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact legacy branch
        uses: actions/checkout@v4
        with:
          ref: governance/legacy-compatibility-only-20260817
          fetch-depth: 0
          show-progress: false

      - name: Write minimal redirect-only public surface
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0; url=https://m72692591-collab.github.io/praxelta-services/">
            <link rel="canonical" href="https://m72692591-collab.github.io/praxelta-services/">
            <title>Устаревший адрес — переход на ПРАКСЕЛЬТУ</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #202020; }
              main { max-width: 44rem; padding: 2rem; text-align: center; }
              a { color: inherit; font-weight: 700; }
            </style>
          </head>
          <body>
            <main>
              <h1>Этот адрес устарел</h1>
              <p>Актуальный отдельный проект называется <strong>ПРАКСЕЛЬТА / PRAXELTA</strong>.</p>
              <p><a href="https://m72692591-collab.github.io/praxelta-services/">Перейти на актуальную витрину ПРАКСЕЛЬТЫ</a></p>
              <p><small>LEGACY_COMPATIBILITY_ONLY · формы, заявки, оплата и аналитика здесь отсутствуют.</small></p>
            </main>
          </body>
          </html>
          HTML

          cat > README.md <<'MD'
          # LEGACY_COMPATIBILITY_ONLY

          Этот репозиторий сохранён только как устаревший технический адрес и безопасное перенаправление.

          Канонический активный проект: **ПРАКСЕЛЬТА / PRAXELTA**  
          Репозиторий: `m72692591-collab/praxelta-services`

          Здесь запрещены новая разработка, услуги, заявки, оплата, реклама, аналитика и самостоятельный бренд. Git-история сохраняется; автоматическое удаление не выполняется.
          MD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate redirect-only contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          index = Path('index.html').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          policy = Path('LEGACY_COMPATIBILITY_ONLY.md').read_text(encoding='utf-8')
          status = json.loads(Path('legacy_status.json').read_text(encoding='utf-8'))

          assert status['status'] == 'LEGACY_COMPATIBILITY_ONLY'
          assert status['active_brand'] is False
          assert status['redirect_only'] is True
          assert status['new_development_allowed'] is False
          assert status['new_marketing_allowed'] is False
          assert status['lead_collection_allowed'] is False
          assert status['analytics_allowed'] is False
          assert status['canonical_destination']['brand_ru'] == 'ПРАКСЕЛЬТА'
          assert status['canonical_destination']['brand_latin'] == 'PRAXELTA'

          combined = '\n'.join((index, readme, policy))
          for required in ('ПРАКСЕЛЬТА', 'PRAXELTA', 'LEGACY_COMPATIBILITY_ONLY'):
              assert required in combined
          forbidden = (
              r'<form\b', r'fetch\s*\(', r'XMLHttpRequest',
              r'google-analytics|gtag\s*\(|yaCounter',
              r'оставить заявку|оплатить|тариф|заказать услугу',
          )
          for pattern in forbidden:
              if re.search(pattern, index, re.IGNORECASE):
                  raise SystemExit(f'Forbidden active functionality remains: {pattern}')
          PY
          python -m py_compile scripts/validate_legacy_redirect.py
          python scripts/validate_legacy_redirect.py
          git diff --check

      - name: Remove one-shot helpers and commit canonical redirect
        run: |
          rm -f \
            .github/workflows/one-shot-canonicalize-and-merge-legacy-redirect.yml \
            .github/workflows/one-shot-finalize-legacy-redirect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Оставить старый адрес только как redirect на ПРАКСЕЛЬТУ'
          git push origin HEAD:governance/legacy-compatibility-only-20260817

      - name: Merge verified legacy PR without deleting branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 1 \
            --repo m72692591-collab/potok-services \
            --squash \
            --subject 'Закрепить старый адрес как LEGACY_COMPATIBILITY_ONLY' \
            --body 'Публичная поверхность сокращена до минимального redirect на ПРАКСЕЛЬТУ. Формы, заявки, оплата, аналитика и новая разработка запрещены; strict validator прошёл. Ветка и история не удаляются.'
